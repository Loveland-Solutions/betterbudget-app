# Runs `flutter analyze` and `flutter test` on every pull request that touches the
# app, and by hand from the Actions tab. On an arm64 Mac, as the goldens in
# app/test/goldens/ are drawn: another machine draws text a pixel differently and
# they would fail. No Flutter cache: each pull request's ref kept its own 1.8 GB
# copy when the Windows build ran here (#205), and the download takes about a minute.
name: Check

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request stops the run still going for the old one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4

      - run: flutter pub get

      - run: flutter analyze

      # A golden that fails leaves its picture and the difference in
      # test/failures/; they are kept with the run for a week.
      - run: flutter test

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures
          path: app/test/failures/
          if-no-files-found: ignore
          retention-days: 7
