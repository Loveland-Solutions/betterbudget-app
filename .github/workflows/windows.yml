# Builds the Windows app and keeps it as a download on the workflow run
# (Actions → this run → Artifacts). Runs on a pushed release tag (v0.35.0), on a
# pull request that touches the Windows code or this file, or by hand from the
# Actions tab. Nothing is published to the releases page from
# here: a Windows build goes there once it has been tried on a Windows PC.
name: Windows build

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['app/windows/**', 'app/pubspec.yaml', '.github/workflows/windows.yml']
  workflow_dispatch:

# Actions are pinned to commits, not tags: this build becomes a public download.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The build number is the commit count (ADR 0006); a shallow
          # checkout would make every build number 1.
          fetch-depth: 0

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $build = git rev-list --count HEAD
          flutter build windows --release --build-number $build

      - name: Name
        id: name
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          "name=BetterBudget-$version-windows" >> $env:GITHUB_OUTPUT

      # The artifact downloads as one zip of the app folder (BetterBudget.exe
      # and the files beside it).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
