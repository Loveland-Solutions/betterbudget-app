# Builds the Windows app and keeps it as a download on the workflow run
# (Actions → this run → Artifacts). Runs on a pushed release tag (v0.35.0), or by
# hand from the Actions tab; not on pull requests (every one bumps pubspec.yaml,
# and each run kept 1.8 GB of caches). Nothing is published to the releases page from
# here: a Windows build goes there once it has been tried on a Windows PC.
name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Actions are pinned to commits, not tags: this build becomes a public download.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count (ADR 0006); a shallow
          # checkout would make every build number 1.
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $build = git rev-list --count HEAD
          flutter build windows --release --build-number $build

      # Microsoft's C++ runtime goes beside BetterBudget.exe, as Microsoft allows
      # (app-local deployment), so a PC that has never installed it still opens
      # the app instead of stopping at "MSVCP140.dll was not found" (#194).
      - name: C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/ -ErrorAction Stop
          }

      - name: Name
        id: name
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          "name=BetterBudget-$version-windows" >> $env:GITHUB_OUTPUT

      # The artifact downloads as one zip of the app folder (BetterBudget.exe
      # and the files beside it).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.name }}
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          # Kept two weeks, not GitHub's 90 days: each build is 15 MB of the
          # account's Actions storage, and a release has its own copy.
          retention-days: 14
