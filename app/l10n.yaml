# Every word the app shows, in English and Mongolian. Edit the .arb files in
# lib/l10n/; `flutter gen-l10n` (or any build) regenerates the Dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: Words
nullable-getter: false
untranslated-messages-file: build/untranslated.json
